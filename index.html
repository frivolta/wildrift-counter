<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WR Counter Pick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--surface:#131a24;--surface2:#1a2332;--border:#1e2d3d;--text:#e0e6ed;--text2:#7a8a9e;--accent:#0ea5e9;--accent2:#38bdf8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}

/* Layout */
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}
header{padding:12px 16px;text-align:center;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:16px;font-weight:700;color:var(--accent2);letter-spacing:0.5px}
header p{font-size:11px;color:var(--text2);margin-top:2px}

/* Search */
.search-wrap{padding:10px 12px;flex-shrink:0}
.search-wrap input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text2)}

/* Champion grid */
.champ-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 12px}
.champ-grid::-webkit-scrollbar{width:4px}
.champ-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.champ-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
.champ-btn:active,.champ-btn.active{border-color:var(--accent);background:var(--surface2);transform:scale(0.96)}
.champ-btn .icon{font-size:24px;margin-bottom:2px}
.champ-btn .name{font-size:10px;color:var(--text2);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ-btn.active .name{color:var(--accent2)}
.no-results{text-align:center;color:var(--text2);padding:24px;font-size:13px}

/* Counter panel (slides up) */
.counter-panel{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:2px solid var(--accent);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .2s ease;z-index:10;max-height:55dvh;display:flex;flex-direction:column}
.counter-panel.open{transform:translateY(0)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-header h2{font-size:15px;font-weight:600}
.panel-header h2 span{color:var(--accent2)}
.panel-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.panel-roles{display:flex;gap:4px;padding:0 16px;flex-shrink:0}
.panel-roles .role-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--text2);text-transform:uppercase;letter-spacing:0.5px}
.counter-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 20px;flex:1}
.counter-item{display:flex;align-items:center;padding:10px 12px;margin-bottom:4px;background:var(--surface2);border-radius:10px;border:1px solid var(--border)}
.counter-item .rank{font-size:13px;font-weight:700;color:var(--text2);width:24px;flex-shrink:0}
.counter-item .rank.top3{color:var(--green)}
.counter-item .c-name{flex:1;font-size:14px;font-weight:500}
.counter-item .c-role{font-size:10px;color:var(--text2);text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--bg);margin-left:6px;flex-shrink:0}
.counter-item .eff{font-size:11px;font-weight:600;margin-left:8px;flex-shrink:0}
.eff.high{color:var(--green)}.eff.med{color:var(--orange)}.eff.low{color:var(--text2)}
.counter-item .c-role.off-role{color:var(--orange);background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35)}

/* Overlay dim */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>WR COUNTER PICK</h1>
    <p>Tap a champion to see counters</p>
  </header>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search champion..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="champ-grid" id="champGrid">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="counter-panel" id="panel">
  <div class="panel-header">
    <h2>Counter <span id="panelName"></span></h2>
    <button class="panel-close" id="panelClose">&times;</button>
  </div>
  <div class="panel-roles" id="panelRoles"></div>
  <div class="counter-list" id="counterList"></div>
</div>

<script src="data.js"></script>
<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const panel = document.getElementById('panel');
const overlay = document.getElementById('overlay');
const panelName = document.getElementById('panelName');
const panelRoles = document.getElementById('panelRoles');
const counterList = document.getElementById('counterList');
const panelClose = document.getElementById('panelClose');

// Role display labels and sort priority (mid first per user request)
const ROLE_PRIORITY = { mid: 0, baron: 1, jungle: 2, duo: 3, support: 4 };
const ROLE_LABEL = { baron: 'TOP', jungle: 'JG', mid: 'MID', duo: 'ADC', support: 'SUP' };

// Build sorted champion list
const champKeys = Object.keys(CHAMPIONS).sort((a, b) =>
  CHAMPIONS[a].name.localeCompare(CHAMPIONS[b].name)
);

// Render champion grid
function renderGrid(filter = '') {
  const f = filter.toLowerCase().trim();
  const filtered = f
    ? champKeys.filter(k => CHAMPIONS[k].name.toLowerCase().includes(f))
    : champKeys;

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1">No champions found</div>';
    return;
  }

  grid.innerHTML = filtered.map(k => {
    const c = CHAMPIONS[k];
    return `<div class="champ-btn" data-key="${k}"><div class="name">${c.name}</div></div>`;
  }).join('');
}

// Get effective role of a counter champion
function getCounterRole(counterKey, targetRoles) {
  const counter = CHAMPIONS[counterKey];
  if (!counter) return 'mid';
  // prefer a role that overlaps with target
  for (const r of targetRoles) {
    if (counter.roles.includes(r)) return r;
  }
  return counter.roles[0];
}

// Show counter panel
function showCounters(key) {
  const champ = CHAMPIONS[key];
  if (!champ) return;

  // Highlight active
  document.querySelectorAll('.champ-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));

  panelName.textContent = champ.name;
  panelRoles.innerHTML = champ.roles
    .map(r => `<span class="role-tag">${ROLE_LABEL[r] || r}</span>`)
    .join('');

  // Build counter list preserving original effectiveness order from data (no position bias)
  const counters = champ.counters.map((cKey, i) => {
    const cc = CHAMPIONS[cKey];
    const role = cc ? getCounterRole(cKey, champ.roles) : champ.roles[0];
    const sharesRole = cc && champ.roles.some(r => cc.roles.includes(r));
    return { key: cKey, name: cc ? cc.name : cKey, role, sharesRole, idx: i };
  });

  counterList.innerHTML = counters.map((c, i) => {
    const effClass = i < 3 ? 'high' : i < 6 ? 'med' : 'low';
    const effLabel = i < 3 ? 'BEST' : i < 6 ? 'GOOD' : 'OK';
    return `<div class="counter-item">
      <div class="rank ${i < 3 ? 'top3' : ''}">${i + 1}</div>
      <div class="c-name">${c.name}</div>
      <div class="c-role${c.sharesRole ? '' : ' off-role'}">${ROLE_LABEL[c.role] || c.role}</div>
      <div class="eff ${effClass}">${effLabel}</div>
    </div>`;
  }).join('');

  panel.classList.add('open');
  overlay.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
  overlay.classList.remove('open');
  document.querySelectorAll('.champ-btn.active').forEach(b => b.classList.remove('active'));
}

// Events
grid.addEventListener('click', e => {
  const btn = e.target.closest('.champ-btn');
  if (btn) showCounters(btn.dataset.key);
});

search.addEventListener('input', () => renderGrid(search.value));
panelClose.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

// Swipe down to close
let touchStartY = 0;
panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 60) closePanel();
}, { passive: true });

// Init
renderGrid();
</script>
</body>
</html>
