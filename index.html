<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WR Counter Pick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--surface:#131a24;--surface2:#1a2332;--surface3:#202d3f;--border:#1e2d3d;--text:#e0e6ed;--text2:#7a8a9e;--accent:#0ea5e9;--accent2:#38bdf8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}

/* Layout */
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}
header{padding:12px 16px 10px;text-align:center;border-bottom:1px solid var(--border);flex-shrink:0}
header h1{font-size:16px;font-weight:700;color:var(--accent2);letter-spacing:1px}
header p{font-size:11px;color:var(--text2);margin-top:2px}

/* Search */
.search-wrap{padding:10px 12px 6px;flex-shrink:0}
.search-wrap input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text2)}

/* Role filter tabs */
.role-tabs{display:flex;gap:6px;padding:0 12px 8px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.role-tabs::-webkit-scrollbar{display:none}
.role-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.role-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Champion grid */
.champ-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 12px}
.champ-grid::-webkit-scrollbar{width:4px}
.champ-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.champ-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 4px 8px;text-align:center;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.champ-btn:active,.champ-btn.active{border-color:var(--accent);background:var(--surface2);transform:scale(0.96)}
.champ-btn .name{font-size:11px;color:var(--text2);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;padding:0 3px}
.champ-btn.active .name{color:var(--accent2)}
.champ-btn .role-pip{font-size:9px;font-weight:600;letter-spacing:0.3px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--text2)}
.champ-btn.active .role-pip{background:rgba(14,165,233,0.2);color:var(--accent2)}
.no-results{text-align:center;color:var(--text2);padding:24px;font-size:13px}

/* Counter panel (slides up) */
.counter-panel{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:2px solid var(--accent);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(0.32,0.72,0,1);z-index:10;max-height:62dvh;display:flex;flex-direction:column}
.counter-panel.open{transform:translateY(0)}

/* Drag handle */
.drag-handle{display:flex;justify-content:center;padding:10px 0 2px;flex-shrink:0}
.drag-handle-bar{width:36px;height:4px;border-radius:2px;background:var(--border)}

.panel-header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;flex-shrink:0}
.panel-header-left{display:flex;flex-direction:column;gap:6px}
.panel-header h2{font-size:16px;font-weight:700}
.panel-header h2 span{color:var(--accent2)}
.panel-roles{display:flex;gap:4px}
.panel-roles .role-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;border:1px solid var(--border)}
.panel-close{background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:18px;cursor:pointer;padding:6px 10px;line-height:1;border-radius:8px;flex-shrink:0}

.counter-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 24px;flex:1}
.counter-list::-webkit-scrollbar{width:4px}
.counter-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.counter-item{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);transition:border-color .1s}
.counter-item:first-child{border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.06)}
.counter-item:nth-child(2){border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.04)}
.counter-item:nth-child(3){border-color:rgba(34,197,94,0.15);background:rgba(34,197,94,0.02)}

.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--surface3);color:var(--text2)}
.rank-badge.top1{background:rgba(34,197,94,0.2);color:var(--green);border:1px solid rgba(34,197,94,0.4)}
.rank-badge.top2{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
.rank-badge.top3{background:rgba(34,197,94,0.1);color:#86efac;border:1px solid rgba(34,197,94,0.2)}

.counter-item .c-name{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter-item .c-role{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--bg);flex-shrink:0;border:1px solid var(--border)}
.counter-item .c-role.off-role{color:var(--orange);background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.35)}

.eff-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;flex-shrink:0;letter-spacing:0.3px}
.eff-badge.high{background:rgba(34,197,94,0.15);color:var(--green)}
.eff-badge.med{background:rgba(245,158,11,0.12);color:var(--orange)}
.eff-badge.low{background:var(--surface3);color:var(--text2)}

/* Section divider */
.section-divider{display:flex;align-items:center;gap:10px;padding:14px 4px 8px}
.section-divider span{font-size:12px;font-weight:700;color:var(--accent2);letter-spacing:0.5px;white-space:nowrap}
.section-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Strong against (red tint for items) */
.counter-item.strong-1{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.06)}
.counter-item.strong-2{border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.04)}
.counter-item.strong-3{border-color:rgba(239,68,68,0.15);background:rgba(239,68,68,0.02)}
.rank-badge.s-top1{background:rgba(239,68,68,0.2);color:var(--red);border:1px solid rgba(239,68,68,0.4)}
.rank-badge.s-top2{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.rank-badge.s-top3{background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.2)}
.eff-badge.s-high{background:rgba(239,68,68,0.15);color:var(--red)}
.eff-badge.s-med{background:rgba(245,158,11,0.12);color:var(--orange)}

/* Overlay dim */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>WR COUNTER PICK</h1>
    <p>Tap a champion to see counters</p>
  </header>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search champion..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="role-tabs" id="roleTabs">
    <button class="role-tab active" data-role="all">ALL</button>
    <button class="role-tab" data-role="baron">TOP</button>
    <button class="role-tab" data-role="jungle">JG</button>
    <button class="role-tab" data-role="mid">MID</button>
    <button class="role-tab" data-role="duo">ADC</button>
    <button class="role-tab" data-role="support">SUP</button>
  </div>
  <div class="champ-grid" id="champGrid">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="counter-panel" id="panel">
  <div class="drag-handle"><div class="drag-handle-bar"></div></div>
  <div class="panel-header">
    <div class="panel-header-left">
      <h2>Matchups: <span id="panelName"></span></h2>
      <div class="panel-roles" id="panelRoles"></div>
    </div>
    <button class="panel-close" id="panelClose">&times;</button>
  </div>
  <div class="counter-list" id="counterList"></div>
</div>

<script src="data.js"></script>
<script>
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const panel = document.getElementById('panel');
const overlay = document.getElementById('overlay');
const panelName = document.getElementById('panelName');
const panelRoles = document.getElementById('panelRoles');
const counterList = document.getElementById('counterList');
const panelClose = document.getElementById('panelClose');
const roleTabs = document.getElementById('roleTabs');

const ROLE_PRIORITY = { mid: 0, baron: 1, jungle: 2, duo: 3, support: 4 };
const ROLE_LABEL = { baron: 'TOP', jungle: 'JG', mid: 'MID', duo: 'ADC', support: 'SUP' };

let activeRole = 'all';

// Build sorted champion list
const champKeys = Object.keys(CHAMPIONS).sort((a, b) =>
  CHAMPIONS[a].name.localeCompare(CHAMPIONS[b].name)
);

// Get primary role label for a champion (highest priority role)
function getPrimaryRole(key) {
  const roles = CHAMPIONS[key].roles;
  const sorted = [...roles].sort((a, b) => (ROLE_PRIORITY[a] ?? 9) - (ROLE_PRIORITY[b] ?? 9));
  return sorted[0];
}

// Render champion grid
function renderGrid() {
  const f = search.value.toLowerCase().trim();
  let filtered = f
    ? champKeys.filter(k => CHAMPIONS[k].name.toLowerCase().includes(f))
    : champKeys;

  if (activeRole !== 'all') {
    filtered = filtered.filter(k => CHAMPIONS[k].roles.includes(activeRole));
  }

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1">No champions found</div>';
    return;
  }

  grid.innerHTML = filtered.map(k => {
    const c = CHAMPIONS[k];
    const primaryRole = getPrimaryRole(k);
    const roleLabel = ROLE_LABEL[primaryRole] || primaryRole;
    return `<div class="champ-btn" data-key="${k}">
      <div class="name">${c.name}</div>
      <div class="role-pip">${roleLabel}</div>
    </div>`;
  }).join('');
}

// Get effective role of a counter champion
function getCounterRole(counterKey, targetRoles) {
  const counter = CHAMPIONS[counterKey];
  if (!counter) return 'mid';
  for (const r of targetRoles) {
    if (counter.roles.includes(r)) return r;
  }
  return counter.roles[0];
}

// Show counter panel
function showCounters(key) {
  const champ = CHAMPIONS[key];
  if (!champ) return;

  document.querySelectorAll('.champ-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));

  panelName.textContent = champ.name;
  panelRoles.innerHTML = champ.roles
    .map(r => `<span class="role-tag">${ROLE_LABEL[r] || r}</span>`)
    .join('');

  const counters = champ.counters.map((cKey, i) => {
    const cc = CHAMPIONS[cKey];
    const role = cc ? getCounterRole(cKey, champ.roles) : champ.roles[0];
    const sharesRole = cc && champ.roles.some(r => cc.roles.includes(r));
    return { key: cKey, name: cc ? cc.name : cKey, role, sharesRole, idx: i };
  });

  // "Countered by" section
  const counteredByHtml = counters.map((c, i) => {
    const effClass = i < 3 ? 'high' : i < 6 ? 'med' : 'low';
    const effLabel = i < 3 ? 'BEST' : i < 6 ? 'GOOD' : 'OK';
    const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
    return `<div class="counter-item">
      <div class="rank-badge ${rankClass}">${i + 1}</div>
      <div class="c-name">${c.name}</div>
      <div class="c-role${c.sharesRole ? '' : ' off-role'}">${ROLE_LABEL[c.role] || c.role}</div>
      <div class="eff-badge ${effClass}">${effLabel}</div>
    </div>`;
  }).join('');

  // "Strong against" section — reverse lookup
  const strongAgainst = [];
  for (const k of champKeys) {
    if (k === key) continue;
    const idx = CHAMPIONS[k].counters.indexOf(key);
    if (idx !== -1) {
      const cc = CHAMPIONS[k];
      const role = getCounterRole(k, champ.roles);
      const sharesRole = champ.roles.some(r => cc.roles.includes(r));
      strongAgainst.push({ key: k, name: cc.name, role, sharesRole, idx });
    }
  }
  strongAgainst.sort((a, b) => a.idx - b.idx);

  const strongHtml = strongAgainst.length
    ? strongAgainst.map((c, i) => {
        const effClass = c.idx < 3 ? 's-high' : c.idx < 6 ? 's-med' : 'low';
        const effLabel = c.idx < 3 ? 'HARD' : c.idx < 6 ? 'GOOD' : 'SOFT';
        const rankClass = i === 0 ? 's-top1' : i === 1 ? 's-top2' : i === 2 ? 's-top3' : '';
        const strongClass = i === 0 ? 'strong-1' : i === 1 ? 'strong-2' : i === 2 ? 'strong-3' : '';
        return `<div class="counter-item ${strongClass}">
          <div class="rank-badge ${rankClass}">${i + 1}</div>
          <div class="c-name">${c.name}</div>
          <div class="c-role${c.sharesRole ? '' : ' off-role'}">${ROLE_LABEL[c.role] || c.role}</div>
          <div class="eff-badge ${effClass}">${effLabel}</div>
        </div>`;
      }).join('')
    : '<div style="text-align:center;color:var(--text2);padding:12px;font-size:12px">No data</div>';

  counterList.innerHTML =
    '<div class="section-divider"><span>WEAK AGAINST</span></div>' +
    counteredByHtml +
    '<div class="section-divider"><span>STRONG AGAINST</span></div>' +
    strongHtml;

  panel.classList.add('open');
  overlay.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
  overlay.classList.remove('open');
  document.querySelectorAll('.champ-btn.active').forEach(b => b.classList.remove('active'));
}

// Events
grid.addEventListener('click', e => {
  const btn = e.target.closest('.champ-btn');
  if (btn) showCounters(btn.dataset.key);
});

search.addEventListener('input', renderGrid);
panelClose.addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

roleTabs.addEventListener('click', e => {
  const tab = e.target.closest('.role-tab');
  if (!tab) return;
  activeRole = tab.dataset.role;
  roleTabs.querySelectorAll('.role-tab').forEach(t => t.classList.toggle('active', t === tab));
  renderGrid();
});

// Swipe down to close
let touchStartY = 0;
panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
panel.addEventListener('touchmove', e => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 60) closePanel();
}, { passive: true });

// Init
renderGrid();
</script>
</body>
</html>
